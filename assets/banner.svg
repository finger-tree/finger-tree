<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <marker id="hw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5f5f5"/>
    </marker>
    <marker id="hr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e63946"/>
    </marker>
    <marker id="hy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffd60a"/>
    </marker>
    <clipPath id="card"><rect width="1000" height="300" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#0b0b0b"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- floating math symbols -->
    <g font-family="'Times New Roman', Georgia, serif" font-style="italic">
      <text x="380" y="52" font-size="26" fill="#ffffff" opacity="0.18">∇ × v<animate attributeName="opacity" values="0.18;0.4;0.18" dur="4s" repeatCount="indefinite"/></text>
      <text x="600" y="40" font-size="22" fill="#ffd60a" opacity="0.35">∂ₜ</text>
      <text x="720" y="58" font-size="28" fill="#ffffff" opacity="0.15">∮<animate attributeName="opacity" values="0.15;0.35;0.15" dur="3.2s" repeatCount="indefinite"/></text>
      <text x="880" y="48" font-size="26" fill="#e63946" opacity="0.55">⊗</text>
      <text x="940" y="120" font-size="24" fill="#ffffff" opacity="0.2">Ω</text>
      <text x="930" y="250" font-size="22" fill="#ffd60a" opacity="0.3">∑<animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.6s" repeatCount="indefinite"/></text>
      <text x="340" y="282" font-size="20" fill="#ffffff" opacity="0.16">a × b = |a||b| sin θ n̂</text>
      <text x="700" y="282" font-size="20" fill="#e63946" opacity="0.4">ê₁ × ê₂ = ê₃</text>
    </g>

    <!-- ICON: rotating frame + abstract cat -->
    <g transform="translate(168 146) scale(0.84)">
      <!-- frame of reference -->
      <circle r="112" fill="none" stroke="#f5f5f5" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 7"/>
      <circle r="78" fill="none" stroke="#f5f5f5" stroke-opacity="0.12" stroke-width="1"/>

      <!-- Omega out of the page -->
      <g transform="translate(-112 -112)" font-family="'Times New Roman', Georgia, serif">
        <circle cx="0" cy="0" r="11" fill="none" stroke="#ffd60a" stroke-width="2"/>
        <circle cx="0" cy="0" r="3" fill="#ffd60a"/>
        <text x="16" y="7" font-size="22" font-style="italic" fill="#ffd60a">Ω</text>
      </g>

      <!-- rotating vectors: v (white) and −2Ω×v (red) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="16s" repeatCount="indefinite"/>
        <g id="vec">
          <circle cx="112" cy="0" r="4.5" fill="#ffd60a"/>
          <line x1="112" y1="0" x2="112" y2="-44" stroke="#f5f5f5" stroke-width="3" marker-end="url(#hw)"/>
          <line x1="112" y1="0" x2="146" y2="0" stroke="#e63946" stroke-width="3" marker-end="url(#hr)"/>
          <text x="118" y="-34" font-family="'Times New Roman', serif" font-style="italic" font-size="17" fill="#f5f5f5">v</text>
        </g>
        <use href="#vec" transform="rotate(120)"/>
        <use href="#vec" transform="rotate(240)"/>
        <!-- orbit trail arc -->
        <path d="M 112 0 A 112 112 0 0 0 56 -97" fill="none" stroke="#ffd60a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#hy)"/>
      </g>

      <!-- abstract geometric cat -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
        <!-- tail: a curl -->
        <path d="M 30 34 C 62 44 66 6 46 4 C 34 3 33 18 43 19" fill="none" stroke="#e63946" stroke-width="5" stroke-linecap="round"/>
        <!-- head: one continuous geometric outline -->
        <path d="M -38 6 L -34 -44 L -12 -26 Q 0 -30 12 -26 L 34 -44 L 38 6 Q 34 36 0 38 Q -34 36 -38 6 Z"
              fill="#0b0b0b" stroke="#f5f5f5" stroke-width="3.5" stroke-linejoin="round"/>
        <!-- eyes: yellow discs with slit pupils -->
        <g>
          <circle cx="-15" cy="0" r="7.5" fill="#ffd60a"/>
          <circle cx="15" cy="0" r="7.5" fill="#ffd60a"/>
          <rect x="-16.5" y="-6" width="3" height="12" rx="1.5" fill="#0b0b0b"/>
          <rect x="13.5" y="-6" width="3" height="12" rx="1.5" fill="#0b0b0b"/>
          <!-- blink lid -->
          <rect x="-26" y="-9" width="52" height="0" fill="#0b0b0b">
            <animate attributeName="height" values="0;0;18;0;0" keyTimes="0;0.9;0.94;0.98;1" dur="5s" repeatCount="indefinite"/>
          </rect>
        </g>
        <!-- nose -->
        <path d="M -4 14 L 4 14 L 0 19 Z" fill="#e63946"/>
        <!-- whiskers as tiny cross-product ticks -->
        <g stroke="#f5f5f5" stroke-width="1.8" stroke-linecap="round" opacity="0.8">
          <path d="M -44 12 L -58 9 M -44 18 L -58 20"/>
          <path d="M 44 12 L 58 9 M 44 18 L 58 20"/>
        </g>
      </g>
    </g>

    <!-- title -->
    <text x="335" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="1"><tspan fill="#f5f5f5">coriolis</tspan><tspan fill="#ffd60a">×</tspan><tspan fill="#e63946">cat</tspan></text>
    <text x="340" y="194" font-family="'Fira Code', 'Courier New', monospace" font-size="20">
      <tspan fill="#ffd60a">F = −2m (Ω × v)</tspan><tspan fill="#f5f5f5" opacity="0.85">  ·  memory × unlearning  ·  5 km/day</tspan>
    </text>
    <g transform="translate(340 216)" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      <rect width="118" height="28" rx="14" fill="#ffd60a"/><text x="59" y="19" fill="#0b0b0b">AI · ML</text>
      <rect x="128" width="140" height="28" rx="14" fill="#e63946"/><text x="198" y="19" fill="#f5f5f5">Neuroscience</text>
      <rect x="278" width="130" height="28" rx="14" fill="#f5f5f5"/><text x="343" y="19" fill="#0b0b0b">Night runner</text>
    </g>

    <!-- bottom accent bars -->
    <rect x="0" y="292" width="1000" height="8" fill="#e63946"/>
    <rect x="0" y="292" width="180" height="8" fill="#ffd60a">
      <animate attributeName="x" values="-180;1000" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
