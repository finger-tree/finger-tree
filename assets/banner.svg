<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1446"/>
      <stop offset="0.45" stop-color="#4a1d7a"/>
      <stop offset="0.8" stop-color="#a62a7d"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7afcff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#5b5bff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5b5bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff6fb5"/>
      <stop offset="1" stop-color="#7afcff"/>
    </linearGradient>
    <linearGradient id="txt" y1="0" y2="0" gradientUnits="userSpaceOnUse" x1="330" x2="950">
      <stop offset="0" stop-color="#ffd166"><animate attributeName="stop-color" values="#ffd166;#ff6fb5;#7afcff;#ffd166" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#ff6fb5"><animate attributeName="stop-color" values="#ff6fb5;#7afcff;#ffd166;#ff6fb5" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#7afcff"><animate attributeName="stop-color" values="#7afcff;#ffd166;#ff6fb5;#7afcff" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="300" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>

    <!-- stars -->
    <g fill="#fff">
      <circle cx="380" cy="40" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="250" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="30" r="2.2"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="60" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="200" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="40" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="270" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
      <text x="800" y="45" font-size="18" fill="#ffd166">✦<animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></text>
      <text x="450" y="70" font-size="14" fill="#7afcff">✦<animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></text>
    </g>

    <!-- waves -->
    <path fill="#ff6fb5" opacity="0.18" d="M-200 250 Q -100 220 0 250 T 200 250 T 400 250 T 600 250 T 800 250 T 1000 250 T 1200 250 V 300 H -200 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;200 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path fill="#7afcff" opacity="0.15" d="M-200 270 Q -100 245 0 270 T 200 270 T 400 270 T 600 270 T 800 270 T 1000 270 T 1200 270 V 300 H -200 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-200 0" dur="9s" repeatCount="indefinite"/>
    </path>

    <!-- ICON: coriolis vortex + cat -->
    <g transform="translate(170 150)">
      <circle r="125" fill="url(#disc)"/>
      <g fill="none" stroke="url(#arm)" stroke-width="7" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="18s" repeatCount="indefinite"/>
        <g id="a1">
          <path d="M 58 -10 C 90 -30 105 -70 80 -105"/>
          <path d="M 80 -105 l -2 18 M 80 -105 l 16 8" stroke-width="6"/>
        </g>
        <use href="#a1" transform="rotate(120)"/>
        <use href="#a1" transform="rotate(240)"/>
      </g>
      <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="4 10" stroke-linecap="round">
        <circle r="112"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/></circle>
      </g>

      <!-- cat (bobbing) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.5s" repeatCount="indefinite"/>
        <!-- tail curling into a swirl -->
        <path d="M 30 40 C 70 55 75 15 52 10 C 38 7 36 25 48 26" fill="none" stroke="#ff9f43" stroke-width="10" stroke-linecap="round"/>
        <!-- ears -->
        <path d="M -42 -22 L -38 -68 L -6 -42 Z" fill="#ff9f43"/>
        <path d="M 42 -22 L 38 -68 L 6 -42 Z" fill="#ff9f43"/>
        <path d="M -34 -32 L -33 -56 L -16 -42 Z" fill="#ff8fc7"/>
        <path d="M 34 -32 L 33 -56 L 16 -42 Z" fill="#ff8fc7"/>
        <!-- head -->
        <ellipse cx="0" cy="0" rx="50" ry="46" fill="#ff9f43"/>
        <!-- tabby stripes -->
        <path d="M -10 -44 q 4 10 0 16 M 0 -46 q 3 11 0 18 M 10 -44 q -4 10 0 16" stroke="#d96b1c" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- cheeks -->
        <ellipse cx="-30" cy="14" rx="9" ry="6" fill="#ff6fb5" opacity="0.6"/>
        <ellipse cx="30" cy="14" rx="9" ry="6" fill="#ff6fb5" opacity="0.6"/>
        <!-- swirl eyes -->
        <g fill="#1b1446">
          <ellipse cx="-18" cy="-6" rx="9" ry="11">
            <animate attributeName="ry" values="11;11;1;11;11" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="18" cy="-6" rx="9" ry="11">
            <animate attributeName="ry" values="11;11;1;11;11" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
          </ellipse>
        </g>
        <g fill="none" stroke="#7afcff" stroke-width="1.8" stroke-linecap="round">
          <path d="M -18 -6 m 0 -1 a 1 1 0 1 1 -1 2 a 3 3 0 1 1 4 -4 a 5 5 0 1 1 -7 6">
            <animateTransform attributeName="transform" type="rotate" values="0 -18 -6;-360 -18 -6" dur="3s" repeatCount="indefinite"/>
          </path>
          <path d="M 18 -6 m 0 -1 a 1 1 0 1 1 -1 2 a 3 3 0 1 1 4 -4 a 5 5 0 1 1 -7 6">
            <animateTransform attributeName="transform" type="rotate" values="0 18 -6;-360 18 -6" dur="3s" repeatCount="indefinite"/>
          </path>
        </g>
        <!-- nose + mouth -->
        <path d="M -5 9 L 5 9 L 0 15 Z" fill="#ff5c8a"/>
        <path d="M 0 15 q -5 8 -11 3 M 0 15 q 5 8 11 3" stroke="#1b1446" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- whiskers -->
        <g stroke="#fff6e6" stroke-width="2" stroke-linecap="round">
          <path d="M -38 6 L -66 0 M -38 13 L -66 15"/>
          <path d="M 38 6 L 66 0 M 38 13 L 66 15"/>
        </g>
      </g>
    </g>

    <!-- title -->
    <text x="335" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" fill="url(#txt)" letter-spacing="1">coriolis-cat</text>
    <text x="340" y="198" font-family="'Fira Code', 'Courier New', monospace" font-size="19" fill="#ffffff" opacity="0.92">🌀 spinning ideas · 🧠 memory × unlearning · 🏃 5 km/day</text>
    <g transform="translate(340 222)">
      <rect width="118" height="28" rx="14" fill="#ffd166"/><text x="59" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b1446">AI · ML</text>
      <rect x="128" width="140" height="28" rx="14" fill="#ff6fb5"/><text x="198" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b1446">Neuroscience</text>
      <rect x="278" width="130" height="28" rx="14" fill="#7afcff"/><text x="343" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b1446">Night runner</text>
    </g>
  </g>
</svg>
