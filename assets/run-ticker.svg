        <text x="170" y="29.0" textLength="2358.0" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#FFD60A" font-weight="700">d = 5 km</tspan><tspan fill="#F5F5F5" font-weight="400">  every day</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Σ week</tspan><tspan fill="#F5F5F5" font-weight="400">  35 km</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Σ year</tspan><tspan fill="#F5F5F5" font-weight="400">  1,825 km</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">1 marathon</tspan><tspan fill="#F5F5F5" font-weight="400">  ≈ every 8.4 days</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">streak</tspan><tspan fill="#F5F5F5" font-weight="400">  n → n + 1</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">pace · good day</tspan><tspan fill="#F5F5F5" font-weight="400">  22 min → 4:24 /km</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">pace · bad day</tspan><tspan fill="#F5F5F5" font-weight="400">  26 min → 5:12 /km</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">v̄</tspan><tspan fill="#F5F5F5" font-weight="400">  5 km / 22–26 min</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">rest day</tspan><tspan fill="#F5F5F5" font-weight="400">  undefined</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan></text>
