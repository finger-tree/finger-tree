        <text x="170" y="29.0" textLength="18135.0" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#FFD60A" font-weight="700">Omega-3 EPA &amp; DHA</tspan><tspan fill="#F5F5F5" font-weight="400">  mackerel, herring, salmon, sardines</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Omega-3 ALA</tspan><tspan fill="#F5F5F5" font-weight="400">  flaxseeds, chia seeds, walnuts</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Omega-6 (linoleic acid)</tspan><tspan fill="#F5F5F5" font-weight="400">  sunflower, safflower, soybean, corn oils</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Histidine</tspan><tspan fill="#F5F5F5" font-weight="400">  meat, eggs, dairy</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Isoleucine</tspan><tspan fill="#F5F5F5" font-weight="400">  meat, eggs, dairy</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Leucine</tspan><tspan fill="#F5F5F5" font-weight="400">  meat, eggs, dairy</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Lysine</tspan><tspan fill="#F5F5F5" font-weight="400">  meat, eggs, dairy</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Methionine</tspan><tspan fill="#F5F5F5" font-weight="400">  meat, eggs, dairy</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Threonine</tspan><tspan fill="#F5F5F5" font-weight="400">  meat, eggs, dairy</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Tryptophan</tspan><tspan fill="#F5F5F5" font-weight="400">  meat, eggs, dairy</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Valine</tspan><tspan fill="#F5F5F5" font-weight="400">  meat, eggs, dairy</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Phenylalanine</tspan><tspan fill="#F5F5F5" font-weight="400">  meat, eggs, dairy</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Vit A (retinol)</tspan><tspan fill="#F5F5F5" font-weight="400">  beef liver, cod liver, eggs</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Vit B1 (thiamine)</tspan><tspan fill="#F5F5F5" font-weight="400">  pork, whole grains, eggs</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Vit B2 (riboflavin)</tspan><tspan fill="#F5F5F5" font-weight="400">  eggs, dairy, liver</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Vit B3 (niacin)</tspan><tspan fill="#F5F5F5" font-weight="400">  meat, fish, eggs</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Vit B5 (pantothenic acid)</tspan><tspan fill="#F5F5F5" font-weight="400">  eggs, meat, mushrooms</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Vit B6 (pyridoxine)</tspan><tspan fill="#F5F5F5" font-weight="400">  meat, fish, potatoes, bananas, eggs</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Vit B7 (biotin)</tspan><tspan fill="#F5F5F5" font-weight="400">  egg yolks, liver</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Vit B9 (folate)</tspan><tspan fill="#F5F5F5" font-weight="400">  leafy greens, legumes, liver, eggs</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Vit B12 (cobalamin)</tspan><tspan fill="#F5F5F5" font-weight="400">  eggs, meat, fish, dairy</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Vit C (ascorbic acid)</tspan><tspan fill="#F5F5F5" font-weight="400">  citrus, bell peppers, kiwi, strawberries · small, frequent doses</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Vit D</tspan><tspan fill="#F5F5F5" font-weight="400">  sunlight, fatty fish, egg yolks, fortified foods</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Vit E (tocopherol)</tspan><tspan fill="#F5F5F5" font-weight="400">  plant oils, almonds, sunflower seeds, hazelnuts</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Vit K1 (phylloquinone)</tspan><tspan fill="#F5F5F5" font-weight="400">  kale, spinach, broccoli + a little fat</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Vit K2 (menaquinone)</tspan><tspan fill="#F5F5F5" font-weight="400">  natto, certain cheeses, egg yolks</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Calcium</tspan><tspan fill="#F5F5F5" font-weight="400">  dairy, sardines, canned salmon</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Phosphorus</tspan><tspan fill="#F5F5F5" font-weight="400">  meat, dairy, fish</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Magnesium</tspan><tspan fill="#F5F5F5" font-weight="400">  seeds, nuts, dark leafy greens</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Sodium</tspan><tspan fill="#F5F5F5" font-weight="400">  salt</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Potassium</tspan><tspan fill="#F5F5F5" font-weight="400">  potatoes, sweet potatoes, avocado, leafy greens, bananas</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Chloride</tspan><tspan fill="#F5F5F5" font-weight="400">  salt</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Sulphur</tspan><tspan fill="#F5F5F5" font-weight="400">  eggs, seafood, meat</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Iron</tspan><tspan fill="#F5F5F5" font-weight="400">  beef, beef liver (heme)</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Zinc</tspan><tspan fill="#F5F5F5" font-weight="400">  meat, shellfish</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Copper</tspan><tspan fill="#F5F5F5" font-weight="400">  beef liver, shellfish, dark chocolate</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Manganese</tspan><tspan fill="#F5F5F5" font-weight="400">  nuts, seeds, whole grains, tea, oats</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Iodine</tspan><tspan fill="#F5F5F5" font-weight="400">  iodised salt, cod, kelp, eggs</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Selenium</tspan><tspan fill="#F5F5F5" font-weight="400">  Brazil nuts (1–2 only), meat, eggs, fish</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Fluoride</tspan><tspan fill="#F5F5F5" font-weight="400">  fluoridated water</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Chromium</tspan><tspan fill="#F5F5F5" font-weight="400">  broccoli, whole grains, meat</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Molybdenum</tspan><tspan fill="#F5F5F5" font-weight="400">  beans, lentils, peas</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan><tspan fill="#FFD60A" font-weight="700">Water</tspan><tspan fill="#F5F5F5" font-weight="400">  H₂O, ideally filtered</tspan><tspan fill="#E63946" font-weight="700">   ◆   </tspan></text>
